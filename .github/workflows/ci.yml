name: ci
on: [push, pull_request]

jobs:
  check:
    name: Check build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: "armv7a-none-eabihf"
      # host workspace (z7-run) pulls in probe-rs, which links against libudev on Linux.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libudev-dev
      - run: just check-dir firmware
      - run: just check-dir host

  build:
    name: Check build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: "armv7a-none-eabihf"
      # host workspace (z7-run) pulls in probe-rs, which links against libudev on Linux.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libudev-dev
      - run: just build-zynq
      - run: just build-dir host

  fmt:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: "armv7a-none-eabihf"
      - run: just check-fmt-dir firmware
      - run: just check-fmt-dir host

  docs:
    name: Check Documentation Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: "armv7a-none-eabihf"
      - run: just docs-zynq

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rust-src
          targets: "armv7a-none-eabihf"
      - run: just clippy-dir firmware

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # host workspace (z7-run) pulls in probe-rs, which links against libudev on Linux.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libudev-dev
      - run: just clippy-dir host
