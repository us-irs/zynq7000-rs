# Example z7-run config file. Pass it with:
#   z7-run --config z7_run.toml --regs <path-to-ron> <path-to-elf>

# This works for the Zedboard. Did not test this for non-FTDI probes or other boards.
fpga_jtag_speed = "15M"
# Slower regular JTAG speed
jtag_speed = "2M"

# Everything here is optional. Values left unset fall back to their env var (ZYNQ_BITSTREAM) or
# built-in default, or the corresponding step (bitstream flashing, serial console) is skipped
# entirely. The RON ops path is deliberately not configurable here - pass it via --regs or the
# ZYNQ_REGS env var instead, since CLI args/env vars are always resolved relative to the current
# directory, unlike paths inside this file.

[fpga]
# Path to the bitstream to load before the ELF is flashed. Absolute paths are used as-is;
# relative paths are resolved relative to this file's own directory, not the current directory.
# Overridden by the ZYNQ_BITSTREAM env var when set.
# bitstream = "../zedboard-gateware/zedboard-rust.bit"

# Serial console to attach to (printing anything received to stdout) once every init/flash step
# is done and the target is running. Uncomment and set `port` to enable it. There's no env var
# override for this section: which port shows up depends on this machine's USB enumeration, not
# on the board.
[serial]
port = "/dev/ttyACM0"
baud_rate = 115200
