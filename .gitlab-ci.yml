# .gitlab-ci.yml

image: rust:latest

variables:
    CARGO_HOME: ${CI_PROJECT_DIR}/.cargo

stages:
  - stage1
  - stage2

.common_setup:
  before_script:
    - curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin
  cache:
    paths:
      - .cargo/registry
      - .cargo/git
      - .cargo/bin
      - firmware/target/
      - host/target/
    key: ${CI_COMMIT_REF_SLUG}

# host workspace (z7-run) pulls in probe-rs, which links against libudev on Linux.
.host_build_setup:
  extends: .common_setup
  before_script:
    - !reference [.common_setup, before_script]
    - apt-get update && apt-get install -y --no-install-recommends pkg-config libudev-dev

check:
  stage: stage1
  extends: .host_build_setup
  script:
    - just check-dir firmware
    - just check-dir host

build:
  stage: stage2
  extends: .host_build_setup
  script:
    - just build-zynq
    - just build-dir host

fmt:
  stage: stage1
  extends: .common_setup
  script:
    - just check-fmt-dir firmware
    - just check-fmt-dir host

docs:
  stage: stage1
  extends: .common_setup
  script:
    - rustup install nightly
    - rustup component add rust-src --toolchain nightly
    - rustup target add armv7a-none-eabihf --toolchain nightly
    - just docs-zynq

clippy:
  stage: stage1
  extends: .host_build_setup
  script:
    - just clippy-dir firmware
    - just clippy-dir host
