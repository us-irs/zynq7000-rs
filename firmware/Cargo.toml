[workspace]
resolver = "3"
members = [
  "zynq7000-rt",
  "zynq7000",
  "zynq7000-hal",

  "examples/simple",
  "examples/embassy",
  "examples/zedboard",
  "examples/defmt",

  "zedboard-bsp",
  "zedboard-qspi-flasher",
]

exclude = [
  # Exclude, can not be built with debug optimization level, too large.
  "zedboard-fsbl",
  # Exclude: needs aarch32-cpu's `critical-section-multi-core` feature, which conflicts with
  # every other example's `critical-section-single-core` under workspace feature unification
  # (both call `critical_section::set_impl!`, so enabling both at once is a hard duplicate-
  # symbol error, not just a behavior difference).
  "examples/zedboard-smp",
  # Relies on brand-new platform.
  # TODO: Pull back into workspace as soon as new embassy executor is released.
  "examples/multiprio",
]

# cargo build/run
[profile.dev]
# default is opt-level = '0', but that makes very
# verbose machine code
opt-level = 's'
# trade compile speed for slightly better optimisations
codegen-units = 1

# cargo build/run --release
[profile.release]
# Optimize for maximum speed.
opt-level = 3
# trade compile speed for slightly better optimisations
codegen-units = 1
# Use Link Time Optimisations to further inline things across
# crates
lto = 'fat'
# Leave the debug symbols in (default is no debug info)
debug = 2
