[package]
name = "zedboard"
version = "0.1.0"
edition = "2024"
description = "Embassy examples for the Zynq7000 SoC"
homepage = "https://github.com/us-irs/zynq7000-rs"
repository = "https://github.com/us-irs/zynq7000-rs"
license = "MIT OR Apache-2.0"
keywords = ["no-std", "arm", "cortex-a", "amd", "zynq7000"]
categories = ["embedded", "no-std", "hardware-support"]

[dependencies]
aarch32-cpu = { version = "0.4", features = ["critical-section-single-core"] }
zynq7000-rt = { path = "../../zynq7000-rt" }
zynq7000 = { path = "../../zynq7000" }
zynq7000-hal = { path = "../../zynq7000-hal", features = ["time-driver-gtc"] }
zedboard-bsp = { path = "../../zedboard-bsp" }
num_enum = { version = "0.7", default-features = false }
embedded-io = "0.7"
bitbybit = "2"
arbitrary-int = "2"
embedded-io-async = "0.7"
critical-section = "1"
static_cell = "2"
embedded-alloc = "0.7"
embedded-hal = "1"
embedded-hal-bus = { version = "0.3", features = ["async"] }
embedded-hal-async = "1"
dummy-pin = "1"
fugit = "0.5"
# axi-uart16550 still expects fugit 0.4's Rate types, so keep it around under a different name
# just for that conversion, until axi-uart16550 itself moves to fugit 0.5.
fugit-04 = { package = "fugit", version = "0.4" }
once_cell = { version = "1.21", default-features = false }
embedded-graphics = "0.8"
log = "0.4"
ssd1306 = { version = "0.10", features = ["async"] }
tinybmp = "0.7"
rand = { version = "0.10", default-features = false }

embassy-executor = { version = "0.10", features = ["platform-cortex-ar", "executor-thread"] }
embassy-time = { version = "0.5", features = ["tick-hz-1_000_000"] }
embassy-net = { version = "0.9", features = ["dhcpv4", "packet-trace", "medium-ethernet", "icmp", "tcp", "udp", "auto-icmp-echo-reply"] }
embedded-sdmmc = "0.10"
embassy-sync = { version = "0.8" }
heapless = "0.9"
axi-uartlite = { version = "0.3" }
axi-uart16550 = { version = "0.3" }
axi-dma = { version = "0.1" }
axi-gpio = { git = "https://github.com/us-irs/axi-hdl-rs.git", rev = "bce2698dfa2d03d6c4614f244f25440c9c536758" }
