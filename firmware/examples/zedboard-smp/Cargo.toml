[package]
name = "zedboard-smp"
version = "0.1.0"
edition = "2024"
description = "Bare-metal SMP hello-world for the Zedboard (Zynq7000, dual Cortex-A9)"
homepage = "https://github.com/us-irs/zynq7000-rs"
repository = "https://github.com/us-irs/zynq7000-rs"
license = "MIT OR Apache-2.0"
keywords = ["no-std", "arm", "cortex-a", "amd", "zynq7000", "smp"]
categories = ["embedded", "no-std", "hardware-support"]

[dependencies]
# Two physically running cores, so critical sections need real cross-core mutual exclusion,
# not just IRQ-disable.
aarch32-cpu = { version = "0.4", features = ["critical-section-multi-core"] }
zynq7000-rt = { path = "../../zynq7000-rt" }
zynq7000-hal = { path = "../../zynq7000-hal", features = ["time-driver-gtc"] }
critical-section = "1"
log = "0.4"
static_cell = "2"
embassy-sync = "0.8"
embedded-io = "0.7"

embassy-executor = { version = "0.10", features = [
  "platform-cortex-ar",
  "executor-thread",
]}
embassy-time = { version = "0.5", features = ["tick-hz-1_000_000"] }

# cargo build/run
[profile.dev]
# default is opt-level = '0', but that makes very
# verbose machine code
opt-level = 's'
# trade compile speed for slightly better optimisations
codegen-units = 1

# cargo build/run --release
[profile.release]
# Optimize for size.
opt-level = 's'
# trade compile speed for slightly better optimisations
codegen-units = 1
# Use Link Time Optimisations to further inline things across
# crates
lto = 'fat'
# Leave the debug symbols in (default is no debug info)
debug = 2
