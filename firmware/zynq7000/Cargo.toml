[package]
name = "zynq7000"
version = "0.5.0"
edition = "2024"
description = "Peripheral Access Crate (PAC) for the Zynq7000 family of SoCs"
homepage = "https://github.com/us-irs/zynq7000-rs"
repository = "https://github.com/us-irs/zynq7000-rs"
license = "MIT OR Apache-2.0"
keywords = ["no-std", "pac", "bare-metal", "amd", "zynq7000"]
categories = ["embedded", "no-std", "hardware-support"]

[dependencies]
static_assertions = "1.1"
derive-mmio = { version = "0.8", default-features = false }
bitbybit = "2"
arbitrary-int = "2"
rustversion = "1"
thiserror = { version = "2", default-features = false }
once_cell = { version = "1", default-features = false, features = ["critical-section"] }
defmt = { version = "1", optional = true }

[features]
defmt = ["dep:defmt", "arbitrary-int/defmt"]

[dev-dependencies]
approx = "0.5"

[package.metadata.docs.rs]
features = ["defmt"]
targets = ["armv7a-none-eabihf"]
rustdoc-args = ["--generate-link-to-definition"]
