[package]
name = "zynq7000-hal"
version = "0.2.0"
edition = "2024"
description = "Hardware Abstraction Layer (HAL) for the Zynq7000 family of SoCs"
homepage = "https://github.com/us-irs/zynq7000-rs"
repository = "https://github.com/us-irs/zynq7000-rs"
license = "MIT OR Apache-2.0"
keywords = ["no-std", "hal", "amd", "zynq7000", "bare-metal"]
categories = ["embedded", "no-std", "hardware-support"]

[dependencies]
aarch32-cpu = { version = "0.4" }
zynq7000 = { path = "../zynq7000", version = "0.4" }
z7-clock-calc = { path = "../../host/z7-clock-calc", version = "0.1" }
static_assertions = "1.1"
bitbybit = "2"
arbitrary-int = "2"
thiserror = { version = "2", default-features = false }
num_enum = { version = "0.7", default-features = false }
bitflags = "2"
embedded-hal-nb = "1"
embedded-io = "0.7"
embedded-hal = "1"
embedded-hal-async = "1"
heapless = "0.9"
static_cell = "2"
delegate = "0.13"
pastey = "0.2.1"
nb = "1"
fugit = "0.5"
critical-section = "1"
libm = "0.2"
log = "0.4"
embassy-sync = "0.8"
embassy-net-driver = "0.2"
smoltcp = { version = "0.14", default-features = false, features = ["proto-ipv4", "medium-ethernet", "socket-raw"] }
vcell = "0.1"
raw-buffer = "0.1"
embedded-io-async = "0.7"
embedded-sdmmc-types = "0.1"
bytemuck = "1.25"

once_cell = { version = "1", default-features = false, features = ["critical-section"], optional = true }
embassy-time-driver = { version = "0.2", optional = true }
embassy-time-queue-utils = { version = "0.3", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }
defmt = { version = "1", optional = true }

[features]
default = ["eth-cache-maintenance"]
alloc = ["z7-clock-calc/alloc"]
defmt = ["dep:defmt", "fugit/defmt", "zynq7000/defmt"]

# Activates the embassy-time support using the global timer counter.
time-driver-gtc = ["dep:embassy-time-driver", "dep:embassy-time-queue-utils", "dep:once_cell"]

# This feature can be enabled if the DDR is accessed through memory addresses 0x8000 to 0x0010_0000.
# In this case, the MMU attribute for the first segment is the DDR memory attribute (outer and
# inner cache maintenance). Otherwise, the OCM attribute (inner cache maintenance only) will be
# used.
first-segment-ddr-attr = []

# These devices have a lower pin count.
7z010-7z007s-clg225 = []

# Enabled by default to run cache maintenance operations on Ethernet DMA buffers.
# Only disable if the Ethernet DMA buffers are placed in a memory region where
# caching is disabled.
eth-cache-maintenance = []

# Enable debug-level (packet size only) and trace-level (packet contents)
# logging of all packets received and transmitted.
eth-packet-trace = []

[dev-dependencies]
approx = "0.5"

[package.metadata.docs.rs]
features = ["alloc", "time-driver-gtc", "defmt"]
targets = ["armv7a-none-eabihf"]
rustdoc-args = ["--generate-link-to-definition"]
